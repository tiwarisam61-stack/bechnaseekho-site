<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareerSync - Admin Applications</title>
    <meta name="description" content="Admin applications panel for CareerSync recruiters and operators." />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <link rel="canonical" href="https://bechnaseekho.com/admin-applications.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --primary: #5B3DF5;
            --text: #0f172a;
            --muted: #475569;
            --line: #e2e8f0;
            --bg: #f8fafc;
            --card: #fff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, sans-serif;
            color: var(--text);
            background: var(--bg);
        }

        .wrap {
            width: min(1220px, 94vw);
            margin: 20px auto;
        }

        .toolbar {
            display: grid;
            grid-template-columns: 1fr 180px 130px 130px;
            gap: 10px;
            margin-bottom: 12px;
        }

        .toolbar input,
        .toolbar select,
        .toolbar button {
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 10px;
            font-size: 13px;
            font-family: Inter, sans-serif;
            background: #fff;
        }

        .toolbar button {
            color: #fff;
            border: 0;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, var(--primary), #4f8cff);
        }

        .table-wrap {
            border: 1px solid var(--line);
            border-radius: 14px;
            overflow: auto;
            background: var(--card);
        }

        table {
            border-collapse: collapse;
            min-width: 1160px;
            width: 100%;
        }

        th,
        td {
            padding: 10px;
            border-bottom: 1px solid var(--line);
            text-align: left;
            font-size: 12px;
            white-space: nowrap;
        }

        th {
            background: #f8fafc;
            color: var(--muted);
            font-size: 11px;
            text-transform: uppercase;
        }

        .row-actions {
            display: inline-flex;
            gap: 6px;
        }

        .btn {
            border: 1px solid #cbd5e1;
            background: #fff;
            border-radius: 8px;
            font-size: 11px;
            padding: 5px 8px;
            cursor: pointer;
            color: #334155;
            text-decoration: none;
        }

        .btn.delete {
            color: #b91c1c;
            border-color: #fca5a5;
        }

        @media (max-width: 900px) {
            .toolbar {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <h1 style="font-family:Poppins,sans-serif;margin:0 0 12px;">Admin Applications</h1>
        <div class="toolbar">
            <input id="search" placeholder="Search by id, name, email, company, job..." />
            <select id="status">
                <option value="">All Status</option>
                <option>Applied</option>
                <option>Under Review</option>
                <option>Interview Scheduled</option>
                <option>Selected</option>
                <option>Rejected</option>
            </select>
            <button id="expCsv">Export CSV</button>
            <button id="expJson">Export JSON</button>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Application ID</th>
                        <th>Candidate</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Company</th>
                        <th>Position</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Resume</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
    </div>

    <script>
        const rows = document.getElementById('rows');
        const search = document.getElementById('search');
        const status = document.getElementById('status');

        async function fetchRows() {
            const query = new URLSearchParams({ q: search.value || '', status: status.value || '' });
            const response = await fetch(`/api/applications?${query.toString()}`);
            const data = await response.json();
            renderRows(data.applications || []);
        }

        function statusSelect(current, id) {
            const list = ['Applied', 'Under Review', 'Interview Scheduled', 'Selected', 'Rejected'];
            return `<select data-id="${id}" class="status-sel">${list.map(v => `<option ${v === current ? 'selected' : ''}>${v}</option>`).join('')}</select>`;
        }

        function renderRows(items) {
            rows.innerHTML = '';
            items.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
          <td>${item.applicationId}</td>
          <td>${item.candidateName}</td>
          <td>${item.email}</td>
          <td>${item.phone}</td>
          <td>${item.appliedCompany}</td>
          <td>${item.appliedPosition}</td>
          <td>${new Date(item.applicationDate).toLocaleDateString()}</td>
          <td>${statusSelect(item.status, item.applicationId)}</td>
          <td>
            <a class="btn" href="${item.resume?.path || '#'}" target="_blank">View</a>
            <a class="btn" href="${item.resume?.path || '#'}" download>Download</a>
          </td>
          <td>
            <span class="row-actions">
              <button class="btn delete" data-del="${item.applicationId}">Delete</button>
            </span>
          </td>
        `;
                rows.appendChild(tr);
            });

            document.querySelectorAll('.status-sel').forEach(sel => {
                sel.addEventListener('change', async e => {
                    const id = e.target.getAttribute('data-id');
                    await fetch(`/api/applications/${encodeURIComponent(id)}/status`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ status: e.target.value })
                    });
                });
            });

            document.querySelectorAll('[data-del]').forEach(btn => {
                btn.addEventListener('click', async e => {
                    const id = e.target.getAttribute('data-del');
                    await fetch(`/api/applications/${encodeURIComponent(id)}`, { method: 'DELETE' });
                    fetchRows();
                });
            });
        }

        search.addEventListener('input', fetchRows);
        status.addEventListener('change', fetchRows);

        document.getElementById('expCsv').addEventListener('click', () => {
            window.open('/api/applications/export.csv', '_blank');
        });

        document.getElementById('expJson').addEventListener('click', () => {
            window.open('/api/applications/export.json', '_blank');
        });

        fetchRows();
    </script>
</body>

</html>
