[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION  = "22"
  NITRO_PRESET  = "netlify"

# Static standalone pages
[[redirects]]
  from   = "/api/mock-interview-ai"
  to     = "/.netlify/functions/mock-interview-ai"
  status = 200

[[redirects]]
  from   = "/api/tts"
  to     = "/.netlify/functions/tts"
  status = 200

[[redirects]]
  from   = "/careersync/journey"
  to     = "/interview-practice.html"
  status = 301
  force  = true

[[redirects]]
  from   = "/ai-arena"
  to     = "/interview-practice.html"
  status = 200
  force  = true

[[redirects]]
  from   = "/mock-interview-practice"
  to     = "/interview-practice.html"
  status = 200
  force  = true

# Serve the SSR handler for every request
[[redirects]]
  from   = "/*"
  to     = "/.netlify/functions/server"
  status = 200

# Static assets — served directly without going through the function
[[headers]]
  for    = "/assets/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for    = "/*.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"
